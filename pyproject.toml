[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pockie-rpg"
version = "0.1.0"
description = "Pockie RPG — local 2D autobattler inspired by Pockie Ninja (pygame-ce)."
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "build>=1",
]

[project.scripts]
pockie-rpg = "pockie_rpg.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Reasonable defaults — no aggressive rules that would block development.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long (we use 100 but allow flexibility)
    "E402",   # module-level imports after non-import code (we have shims)
]
